[project]
name = "audio-stemmer"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [ "dotenv>=0.9.9", "flask>=3.1.3", "flask-cors>=6.0.2", "requests>=2.34.2", "toml>=0.10.2",]

[dependency-groups]
dev = [ "pre-commit>=4.5.1", "ruff>=0.15.8", "mypy>=1.0.0", "pytest>=7.0.0",]

[tool.mypy]
[[tool.mypy.overrides]]
module = [ "flask_cors",]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [ "tests",]
norecursedirs = [ "node_modules", "frontend/node_modules", ".venv", "audio-stemmer-server/.venv",]
